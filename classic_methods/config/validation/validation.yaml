seed: ${project.seed}

data:
  csv_path: ${paths.processed_data_csv}
  user_col: CustomerID
  item_col: item_idx
  date_col: Order Date

pipeline:
  recommendation_config_path: config/recommendation/pipeline_validation.yaml
  recommendation_k: 20

sampling:
  users_per_repetition: 20

masking:
  strategy: last_novel_tail_item
  tail_fraction: 0.2
  min_training_customer_support: 3

metrics:
  k: 10

output:
  summary_path: ${paths.output_dir}/validation_summary.json
  config_artifact_path: ${paths.mlflow_dir}/validation_config_bundle.json

mlflow:
  enabled: false
  tracking_uri: null
  experiment_name: classic_methods_validation
  run_name: null
  tags: {}
