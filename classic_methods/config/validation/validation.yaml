seed: ${project.seed}

data:
  csv_path: ${paths.processed_data_csv}
  user_col: CustomerID
  item_col: item_idx

pipeline:
  recommendation_config_path: config/recommendation/pipeline_validation.yaml
  recommendation_k: 10

sampling:
  users_per_repetition: 20

masking:
  strategy: remove_whole_item

metrics:
  k: 10

output:
  summary_path: ${paths.output_dir}/validation_summary.json
