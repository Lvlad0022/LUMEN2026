[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "classic-methods"
version = "0.1.0"
description = "Classic recommendation-method experiments for preprocessing, embeddings, clustering, and similarity models."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "matplotlib>=3.8",
  "mlflow>=2.14",
  "torch>=2.2",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "pytest>=8.0",
  "jupyter>=1.0",
  "ipykernel>=6.29",
]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["pipeline", "pipeline_contracts", "train_cluster"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["api*", "data_processing*", "embeddings*", "clustering*", "evaluation*", "models*", "validation*"]
